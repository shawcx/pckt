[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pckt"
version = "0.3"
description = "Packet construction and decoding, with libpcap bindings"
readme = "README.rst"
requires-python = ">=3.11"
# set in setup.py: the "MIT" expression form needs setuptools 77, newer than Ubuntu 24.04's,
# and 77 and later deprecate the {text = "MIT"} table form
dynamic = ["license"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: System :: Networking",
]

[tool.setuptools.packages.find]
include = ["pckt*"]

[tool.setuptools.package-data]
# py.typed: pcap.pyi types the compiled pckt.pcap
pckt = ["manuf", "py.typed", "*.pyi"]
